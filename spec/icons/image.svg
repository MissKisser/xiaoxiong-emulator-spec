<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="image-title">
  <title id="image-title">镜像</title>
  <!-- 形态意图：环形读作光盘，中心孔是安装介质的固有特征；一段留白高光弧暗示可读取的介质表面而非普通圆环 -->

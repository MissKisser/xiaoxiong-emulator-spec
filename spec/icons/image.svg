    <circle cx="12" cy="12" r="8.5" />
    <circle cx="12" cy="12" r="2.5" />
  </g>
  <path d="M12 3.5a8.5 8.5 0 0 1 6 2.5" fill="none" stroke="#2E5C4A" stroke-width="2" stroke-linecap="round" />
</svg>
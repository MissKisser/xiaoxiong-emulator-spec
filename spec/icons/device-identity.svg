<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="device-identity-title">
  <title id="device-identity-title">设备标识</title>
  <!-- 形态意图：芯片外形带引脚，内部一条唯一编号的横杠，代表每实例强制独立且不得自动复用的设备标识。不用人形或头像，避免读成用户账号 -->
  <g fill="none" stroke="#1C1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6.5" y="6.5" width="11" height="11" rx="1.5" />
    <path d="M9.5 6.5V3.5M14.5 6.5V3.5M9.5 20.5v-3M14.5 20.5v-3" />
    <path d="M6.5 10.5H3.5M6.5 13.5H3.5M20.5 10.5h-3M20.5 13.5h-3" />
  </g>
  <path d="M9.5 12h5" fill="none" stroke="#2E5C4A" stroke-width="2" stroke-linecap="round" />
</svg>
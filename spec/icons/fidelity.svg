<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="fidelity-title">
  <title id="fidelity-title">保真度</title>
  <!-- 形态意图：盾内对勾表示能力已达成，即保真度六项逐项实测通过的结论。半环刻度读作「按项核验」，避免用一个实心盾把未达成项也读成已达成 -->

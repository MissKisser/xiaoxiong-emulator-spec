    <path d="M12 2.8 20 6v6.2c0 4.3-3.2 7.6-8 9-4.8-1.4-8-4.7-8-9V6z" />
  </g>
  <path d="m8.4 11.8 2.6 2.6 4.6-4.8" fill="none" stroke="#2E5C4A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
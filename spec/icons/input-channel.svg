<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="input-channel-title">
  <title id="input-channel-title">输入通道</title>
  <!-- 形态意图：手指触点落在屏内代表向实例投递触摸与按键。输入通道分原生输入与投屏两条通路，因此底部画两条并行轨道而非单线，读作「二选一」 -->
  <g fill="none" stroke="#1C1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="3" width="15" height="18" rx="2.5" />
    <circle cx="11" cy="11" r="2.2" fill="#2E5C4A" stroke="none" />
    <path d="M8.5 16.5h7" />
    <path d="M8.5 19h4" />
  </g>
</svg>
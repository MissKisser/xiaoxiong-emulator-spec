<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="multi-instance-title">
  <title id="multi-instance-title">多开</title>
  <!-- 形态意图：三块等宽卡片横向并列且各自带一条底线，读作三个互不干扰的独立环境并行走；卡片不重叠以免与快照的层叠语义混用 -->
  <g fill="none" stroke="#1C1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="7" width="5.5" height="10" rx="1.5" />
    <rect x="9.25" y="7" width="5.5" height="10" rx="1.5" />
    <rect x="16" y="7" width="5.5" height="10" rx="1.5" />
  </g>
</svg>
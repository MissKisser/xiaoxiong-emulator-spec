<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="mark-inverse-title">
  <title id="mark-inverse-title">小熊模拟器 纯图形标识 反色版</title>
  <!-- 分层意图：与浅色底版本共用同一套几何，只把两层主色对调，五官改用森林绿以在深色底上保持足够对比 -->
  <g id="bear-silhouette" fill="#F7F4F0">
    <g id="ears">
      <circle cx="74" cy="68" r="30" />
      <circle cx="182" cy="68" r="30" />
    </g>
    <circle id="head" cx="128" cy="140" r="78" />
    <g id="muzzle" fill="#C87533">
      <circle cx="74" cy="68" r="14" />
      <circle cx="182" cy="68" r="14" />
      <ellipse cx="128" cy="170" rx="38" ry="30" />
    </g>
  </g>
  <g id="features" fill="#2E5C4A">
    <circle id="eye-left" cx="96" cy="124" r="12" />
    <circle id="eye-right" cx="160" cy="124" r="12" />
    <ellipse id="nose" cx="128" cy="154" rx="13" ry="8" />
  </g>
</svg>
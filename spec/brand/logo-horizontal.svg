<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="500" height="160" role="img" aria-labelledby="horizontal-title">
  <title id="horizontal-title">小熊模拟器 Xiaoxiong Emulator</title>
  <!-- 分层意图：左侧地砖把图形锁成不依赖背景的独立块，右侧文字跟随 typography.fontFamily.primary，色值取自 design-tokens.json -->
  <g id="mark-block" transform="translate(8 8)">
    <g transform="scale(0.5625)">
      <g id="tile" fill="#2E5C4A">
        <rect x="0" y="0" width="256" height="256" rx="56" />
      </g>
      <g id="bear-silhouette" fill="#F7F4F0">
        <g id="ears">
          <circle cx="74" cy="68" r="30" />
          <circle cx="182" cy="68" r="30" />
        </g>
        <circle id="head" cx="128" cy="140" r="78" />
        <g id="inner-ears" fill="#C87533">
          <circle cx="74" cy="68" r="14" />
          <circle cx="182" cy="68" r="14" />
        </g>
        <ellipse id="muzzle" cx="128" cy="170" rx="38" ry="30" fill="#C87533" />
      </g>
      <g id="features" fill="#1C1917">
        <circle id="eye-left" cx="96" cy="124" r="12" />
        <circle id="eye-right" cx="160" cy="124" r="12" />
        <ellipse id="nose" cx="128" cy="154" rx="13" ry="8" />
      </g>
    </g>
  </g>
  <g id="wordmark" font-family="Microsoft YaHei UI, Segoe UI, sans-serif">
    <text x="192" y="74" font-size="52" font-weight="700" fill="#1C1917">小熊模拟器</text>
    <text x="196" y="112" font-size="22" font-weight="400" letter-spacing="3" fill="#57534E">Xiaoxiong Emulator</text>
  </g>
</svg>
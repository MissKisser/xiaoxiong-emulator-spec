<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="mark-title">
  <title id="mark-title">小熊模拟器 纯图形标识</title>
  <!-- 分层意图：透明底，熊头与双耳合并为单一实心剪影以保证窄界面可辨，吻部与五官用浅色和深色拉开层次 -->
  <g id="bear-silhouette" fill="#C87533">
    <g id="ears">
      <circle cx="74" cy="68" r="30" />
      <circle cx="182" cy="68" r="30" />
    </g>
    <circle id="head" cx="128" cy="140" r="78" />
    <g id="muzzle" fill="#F7F4F0">
      <circle cx="74" cy="68" r="14" />
      <circle cx="182" cy="68" r="14" />
      <ellipse cx="128" cy="170" rx="38" ry="30" />
    </g>
  </g>
  <g id="features" fill="#1C1917">
    <circle id="eye-left" cx="96" cy="124" r="12" />
    <circle id="eye-right" cx="160" cy="124" r="12" />
    <ellipse id="nose" cx="128" cy="154" rx="13" ry="8" />
  </g>
</svg>